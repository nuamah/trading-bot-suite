services:
  freqtrade:
    image: freqtradeorg/freqtrade:stable
    container_name: freqtrade
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./user_data:/freqtrade/user_data
    ports:
      - "8080:8080"
    command:
      - trade
      - --config
      - /freqtrade/user_data/config.json
      - --strategy
      - TripleGuard
    environment:
      FREQTRADE__EXCHANGE__KEY: ${BINANCE_ACTIVE_API_KEY}
      FREQTRADE__EXCHANGE__SECRET: ${BINANCE_ACTIVE_API_SECRET}
      FREQTRADE__EXCHANGE__SANDBOX: ${BINANCE_SANDBOX}
      FREQTRADE__DRY_RUN: ${FREQTRADE_DRY_RUN}
      FREQTRADE__TELEGRAM__TOKEN: ${TELEGRAM_BOT_TOKEN}
      FREQTRADE__TELEGRAM__CHAT_ID: ${TELEGRAM_CHAT_ID}
